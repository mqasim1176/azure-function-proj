name: Azure Functions CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-validate:
    name: Build and Validate Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project structure
        run: |
          test -f host.json
          test -f package.json
          test -f src/functions/HealthCheck.js
          echo "Function project files found."

      - name: Build project if configured
        run: npm run build --if-present

      - name: Run tests if configured
        run: npm test --if-present

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ams-functions-source
          path: |
            host.json
            package.json
            package-lock.json
            src/**
          if-no-files-found: error
          retention-days: 7
  deploy:
    name: Validate deployment artifact
    runs-on: ubuntu-latest
    needs: build-and-validate

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: downloaded-package

      - name: Validate downloaded package
        run: |
          test -f downloaded-package/host.json
          test -f downloaded-package/package.json
          test -f downloaded-package/src/functions/HealthCheck.js
          test -d downloaded-package/node_modules/@azure/functions
          echo "Deployment artifact is ready."

      - name: Show package contents
        run: find downloaded-package -maxdepth 3 -type f | sort