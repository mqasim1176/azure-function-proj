
name: Azure Functions CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and Package Function
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project structure
        run: |
          test -f host.json
          test -f package.json
          test -f src/functions/HealthCheck.js

      - name: Run tests
        run: npm test --if-present

      - name: Check dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Prepare deployment package
        run: |
          mkdir -p release
          cp host.json package.json package-lock.json release/
          cp -r src release/
          npm ci --omit=dev --prefix release

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: function-package
          path: release/
          if-no-files-found: error
          retention-days: 7

  
  deploy:
    name: Deploy Azure Function
    runs-on: ubuntu-latest
    needs: build

    # Only deploy from staging; pull requests must not deploy.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/staging'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: function-package
          path: downloaded-package

      - name: Validate package
        run: |
          test -f downloaded-package/host.json
          test -f downloaded-package/package.json
          test -d downloaded-package/node_modules/@azure/functions

      - name: Log in to Azure with OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: 'func-ams-flex-test-x7422'
          package: downloaded-package

